<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmacy Partner Sign In – PharmaTech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23059669'><path d='M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z'/></svg>">
  <style>
    .auth-page-wrapper {
      min-height: calc(100vh - 75px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      background: radial-gradient(circle at top right, #ecfdf5 0%, #f0fdf4 50%, #f8fafc 100%);
    }

    .auth-card {
      background: white;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 520px;
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header {
      padding: 2.25rem 2rem 1.25rem;
      text-align: center;
      background: #fafcfb;
      border-bottom: 1px solid var(--border-light);
    }

    .auth-tab-group {
      display: flex;
      background: #f1f5f9;
      padding: 0.35rem;
      border-radius: var(--radius-full);
      margin-top: 1.25rem;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 0.6rem 1rem;
      border: none;
      background: transparent;
      border-radius: var(--radius-full);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .auth-tab-btn.active {
      background: white;
      color: #065f46;
      box-shadow: var(--shadow-sm);
    }

    .auth-body {
      padding: 2rem 2.25rem;
    }

    .password-input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-input-group input {
      padding-right: 2.75rem;
    }

    .password-toggle-btn {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
    }

    .auth-alert {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      font-weight: 600;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
  </style>
</head>
<body>

  <!-- Clean Professional Header -->
  <header class="navbar-wrapper">
    <div class="navbar-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon-box" style="background: #059669; color: white;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z"/>
          </svg>
        </div>
        <div class="brand-text">Pharma<span>Tech</span> <small style="font-size: 0.72rem; color: #059669; font-weight: 800; text-transform: uppercase; margin-left: 0.25rem;">Partner</small></div>
      </a>
      <div>
        <a href="index.html" class="btn btn-outline-primary" style="font-size: 0.82rem; padding: 0.45rem 0.85rem;">
          ← Return to Store
        </a>
      </div>
    </div>
  </header>

  <!-- Main Auth Card -->
  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: #ecfdf5; color: #059669; border-radius: 50%; margin-bottom: 0.75rem;">
          <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
          </svg>
        </div>
        <h2 style="font-size: 1.45rem; font-weight: 800; color: var(--text-main); margin: 0;">Pharmacy Owner Portal</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.35rem;">
          Manage store inventory, purchase invoice stock updates, counter billing, and orders
        </p>

        <!-- Tab Controls -->
        <div class="auth-tab-group">
          <button class="auth-tab-btn active" data-tab="tabLogin">Sign In</button>
          <button class="auth-tab-btn" data-tab="tabRegister">Partner Registration</button>
        </div>
      </div>

      <div class="auth-body">
        
        <!-- Panel 1: Pharmacy Owner Login -->
        <div id="tabLogin" class="auth-form-panel">
          <div id="pharmacyLoginAlert" class="auth-alert"></div>

          <form id="pharmacyLoginForm" autocomplete="off">
            <div class="form-group">
              <label class="form-label" for="pharmLoginEmail">Registered Email Address</label>
              <input type="email" id="pharmLoginEmail" class="form-input" placeholder="owner@pharmacy.com" required autocomplete="off">
            </div>

            <div class="form-group">
              <label class="form-label" for="pharmLoginPassword">Password</label>
              <div class="password-input-group">
                <input type="password" id="pharmLoginPassword" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                <button type="button" class="password-toggle-btn" data-target="pharmLoginPassword" aria-label="Toggle password visibility">
                  <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
              </div>
            </div>

            <button type="submit" id="pharmLoginBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 1.25rem; font-weight: 700; font-size: 0.95rem;">
              Sign In to Pharmacy Dashboard →
            </button>
          </form>
        </div>

        <!-- Panel 2: Pharmacy Owner Registration -->
        <div id="tabRegister" class="auth-form-panel" style="display: none;">
          <div id="pharmacyRegisterAlert" class="auth-alert"></div>

          <form id="pharmacyRegisterForm" autocomplete="off">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="pharmRegStoreName">Pharmacy Name</label>
                <input type="text" id="pharmRegStoreName" class="form-input" placeholder="e.g. Apollo Pharmacy Express" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="pharmRegOwnerName">Owner Full Name</label>
                <input type="text" id="pharmRegOwnerName" class="form-input" placeholder="Dr. Vikram Patel" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="pharmRegEmail">Email Address</label>
                <input type="email" id="pharmRegEmail" class="form-input" placeholder="owner@example.com" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="pharmRegPhone">Mobile Number</label>
                <input type="tel" id="pharmRegPhone" class="form-input" placeholder="10-digit number" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="pharmRegLicense">Drug Licence Number</label>
              <input type="text" id="pharmRegLicense" class="form-input" placeholder="e.g. DL-KA-2024-984321" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="pharmRegAddress">Pharmacy Store Address</label>
              <input type="text" id="pharmRegAddress" class="form-input" placeholder="Shop / Plot No., Street, Area" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="pharmRegCity">City</label>
                <input type="text" id="pharmRegCity" class="form-input" placeholder="e.g. Bangalore" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="pharmRegPin">PIN Code</label>
                <input type="text" id="pharmRegPin" class="form-input" placeholder="e.g. 560038" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="pharmRegPassword">Password</label>
                <div class="password-input-group">
                  <input type="password" id="pharmRegPassword" class="form-input" placeholder="Min. 6 characters" required>
                  <button type="button" class="password-toggle-btn" data-target="pharmRegPassword">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                  </button>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="pharmRegConfirm">Confirm Password</label>
                <div class="password-input-group">
                  <input type="password" id="pharmRegConfirm" class="form-input" placeholder="Re-enter password" required>
                  <button type="button" class="password-toggle-btn" data-target="pharmRegConfirm">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                  </button>
                </div>
              </div>
            </div>

            <button type="submit" id="pharmRegBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 1rem; font-weight: 700;">
              Register Pharmacy & Continue →
            </button>
          </form>
        </div>

      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
