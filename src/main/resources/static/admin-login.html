<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Sign In – PharmaTech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23dc2626'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z'/></svg>">
  <style>
    .auth-page-wrapper {
      min-height: calc(100vh - 75px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      background: radial-gradient(circle at top right, #fef2f2 0%, #f8fafc 100%);
    }

    .auth-card {
      background: white;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header {
      padding: 2.25rem 2rem 1.25rem;
      text-align: center;
      background: #fafcfb;
      border-bottom: 1px solid var(--border-light);
    }

    .auth-body {
      padding: 2rem 2.25rem;
    }

    .password-input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-input-group input {
      padding-right: 2.75rem;
    }

    .password-toggle-btn {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
    }

    .auth-alert {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Clean Professional Header -->
  <header class="navbar-wrapper">
    <div class="navbar-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon-box" style="background: #dc2626; color: white;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
          </svg>
        </div>
        <div class="brand-text">Pharma<span>Tech</span> <small style="font-size: 0.72rem; color: #dc2626; font-weight: 800; text-transform: uppercase; margin-left: 0.25rem;">Admin</small></div>
      </a>
      <div>
        <a href="index.html" class="btn btn-outline-primary" style="font-size: 0.82rem; padding: 0.45rem 0.85rem;">
          ← Return to Store
        </a>
      </div>
    </div>
  </header>

  <!-- Main Auth Card -->
  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: #fee2e2; color: #dc2626; border-radius: 50%; margin-bottom: 0.75rem;">
          <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
          </svg>
        </div>
        <h2 style="font-size: 1.45rem; font-weight: 800; color: var(--text-main); margin: 0;">System Administrator Sign In</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.35rem;">
          Authorized PharmaTech platform operations & fleet monitoring console
        </p>
      </div>

      <div class="auth-body">
        <div id="adminLoginAlert" class="auth-alert"></div>

        <form id="adminLoginForm" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="adminEmail">Administrator Email Address</label>
            <input type="email" id="adminEmail" class="form-input" placeholder="admin@pharmatech.com" required autocomplete="off">
          </div>

          <div class="form-group">
            <label class="form-label" for="adminPassword">Password</label>
            <div class="password-input-group">
              <input type="password" id="adminPassword" class="form-input" placeholder="Enter administrator password" required autocomplete="current-password">
              <button type="button" class="password-toggle-btn" data-target="adminPassword" aria-label="Toggle password visibility">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="adminSubmitBtn" class="btn" style="width: 100%; background: #dc2626; color: white; padding: 0.85rem; margin-top: 1.25rem; font-weight: 700; font-size: 0.95rem; border-radius: var(--radius-md);">
            Sign In to Admin Console →
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Password toggle
      document.querySelectorAll('.password-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (!input) return;
          if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path></svg>`;
          } else {
            input.type = 'password';
            btn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>`;
          }
        });
      });

      const adminForm = document.getElementById('adminLoginForm');
      if (adminForm) {
        adminForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const alertEl = document.getElementById('adminLoginAlert');
          alertEl.style.display = 'none';

          const identifier = document.getElementById('adminEmail').value.trim();
          const password = document.getElementById('adminPassword').value;

          if (!identifier || !password) {
            alertEl.style.display = 'block';
            alertEl.style.background = '#fee2e2';
            alertEl.style.color = '#991b1b';
            alertEl.textContent = 'Please enter administrator email and password.';
            return;
          }

          const btn = document.getElementById('adminSubmitBtn');
          btn.disabled = true;
          btn.textContent = 'Authenticating...';

          try {
            const res = await API.loginAdmin({ identifier, password });
            if (res && res.data) {
              if (res.data.role !== 'ROLE_ADMIN') {
                throw new Error('Access denied. This account does not possess administrator credentials.');
              }
              API.saveUserSession(res.data);
              alertEl.style.display = 'block';
              alertEl.style.background = '#dcfce7';
              alertEl.style.color = '#15803d';
              alertEl.textContent = 'Administrator authenticated! Opening console...';
              setTimeout(() => {
                window.location.href = 'admin-dashboard.html';
              }, 700);
            }
          } catch (err) {
            alertEl.style.display = 'block';
            alertEl.style.background = '#fee2e2';
            alertEl.style.color = '#991b1b';
            alertEl.textContent = err.message || 'Authentication failed. Please verify administrator credentials.';
          } finally {
            btn.disabled = false;
            btn.textContent = 'Sign In to Admin Console →';
          }
        });
      }
    });
  </script>
</body>
</html>
