# ===================================================================
# PharmaTech Application Configuration
# ===================================================================
spring.application.name=PharmaTech

# Active Profile:
# - 'dev' uses embedded H2 with MySQL compatibility mode for instant one-click running
# - 'mysql' connects directly to a live local MySQL server (port 3306)
spring.profiles.active=dev

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Let JPA/Hibernate manage schema auto-creation
spring.sql.init.mode=never
